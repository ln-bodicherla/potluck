[project]
name = "potluck"
version = "0.0.1"
description = "Pool your Macs, PCs, and GPUs with people you trust and run big AI models together."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Potluck contributors" }]
keywords = ["llm", "distributed-inference", "exo", "apple-silicon", "cluster"]
dependencies = []  # stdlib-only CLI for now; exo is installed separately by scripts/setup.sh

[project.scripts]
potluck = "potluck.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/potluck"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potluck"]
